# Second Compose file. docker-compose.yml stays as upstream wrote it.
#
#   docker compose -f docker-compose.yml -f giro/docker-compose.aws.yml up -d --build
#
# Compose 2.24 or newer is required for the !override tag. The instance
# installs 2.39.2. .env supplies ARTEX_BIND_ADDR, ARTEX_TRUSTED_PROXIES, and
# POSTGRES_PASSWORD. The database URL stays the upstream value, which points
# at the postgres service on this host. ARTEX writes jwt.key and secret.key
# under ./keys. Do not set ARTEX_SECRET_KEY.

services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  artex:
    ports: !override
      - "${ARTEX_BIND_ADDR:?Set ARTEX_BIND_ADDR to this host's private address}:8787:8787"
      - "127.0.0.1:8788:8788"
    environment:
      ARTEX_TRUSTED_PROXIES: ${ARTEX_TRUSTED_PROXIES:?Set ARTEX_TRUSTED_PROXIES}
      # Opt-in upstream. Leave it off so a health check does not call GitHub.
      ARTEX_UPDATE_CHECK: "0"
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
